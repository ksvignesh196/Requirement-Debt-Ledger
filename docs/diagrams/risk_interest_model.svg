<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <text x="490" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Mathematical Risk &amp; Debt Interest Escalation Model</text>
  <text x="490" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Derivation Flow from Multi-Factor Inputs to Dynamic Effective Risk and Priority Index (DPI)</text>

  <!-- Step 1: Inputs -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="180" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="25" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">1. INPUT DIMENSIONS</text>
    <text x="15" y="55" fill="#f8fafc" font-size="11">• Business Impact (1-5)</text>
    <text x="15" y="75" fill="#f8fafc" font-size="11">• Architecture Impact (1-5)</text>
    <text x="15" y="95" fill="#f8fafc" font-size="11">• Safety &amp; Compliance (1-5)</text>
    <text x="15" y="115" fill="#f8fafc" font-size="11">• Occurrence Prob (1-5)</text>
    <text x="15" y="135" fill="#f8fafc" font-size="11">• Detection Invisibility (1-5)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="220" y1="175" x2="265" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)" />

  <!-- Step 2: Base Risk -->
  <g transform="translate(270, 100)">
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">2. BASE STATIC RISK (R₀)</text>
    <text x="15" y="55" fill="#94a3b8" font-size="10">Composite Severity (I):</text>
    <text x="15" y="73" fill="#f8fafc" font-size="10" font-weight="600">0.35·S_b + 0.35·S_a + 0.30·S_s</text>
    <text x="15" y="105" fill="#94a3b8" font-size="10">Base Formula:</text>
    <text x="15" y="125" fill="#38bdf8" font-size="11" font-weight="bold">R₀ = (I × O × D / 125) × 100</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="470" y1="175" x2="515" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)" />

  <!-- Step 3: Compounding Interest -->
  <g transform="translate(520, 100)">
    <rect x="0" y="0" width="200" height="150" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">3. TIME DEBT INTEREST</text>
    <text x="15" y="55" fill="#94a3b8" font-size="10">Grace Period: 14 Days</text>
    <text x="15" y="75" fill="#94a3b8" font-size="10">Daily Interest Rate (r): 0.8%</text>
    <text x="15" y="105" fill="#94a3b8" font-size="10">Interest Factor:</text>
    <text x="15" y="125" fill="#fbbf24" font-size="11" font-weight="bold">(1 + 0.008)^max(0, Δt - 14)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="720" y1="175" x2="765" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)" />

  <!-- Step 4: Overdue Penalty -->
  <g transform="translate(770, 100)">
    <rect x="0" y="0" width="170" height="150" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5" />
    <text x="85" y="25" text-anchor="middle" fill="#f87171" font-size="12" font-weight="bold">4. OVERDUE PENALTY</text>
    <text x="15" y="55" fill="#94a3b8" font-size="10">If Current Date &gt; Review:</text>
    <text x="15" y="75" fill="#f87171" font-size="10" font-weight="600">+25% per 30 days</text>
    <text x="15" y="105" fill="#94a3b8" font-size="10">Overdue Multiplier:</text>
    <text x="15" y="125" fill="#f87171" font-size="10" font-weight="bold">1.0 + min(1.0, d/30 × 0.25)</text>
  </g>

  <!-- Combining Arrow down -->
  <path d="M 855 250 C 855 330, 700 330, 520 330" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)" />

  <!-- Step 5: Effective Dynamic Risk -->
  <g transform="translate(300, 300)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    <text x="110" y="28" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">DYNAMIC RISK R(t)</text>
    <text x="110" y="52" text-anchor="middle" fill="#f8fafc" font-size="11">min(100, R₀ × Interest × Overdue)</text>
  </g>

  <!-- Arrow to Tiers -->
  <line x1="410" y1="380" x2="410" y2="425" stroke="#34d399" stroke-width="2" marker-end="url(#arr)" />

  <!-- Step 6: Risk Tiers -->
  <g transform="translate(140, 430)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#064e3b" />
    <text x="60" y="24" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="bold">LOW (&lt; 35)</text>

    <rect x="140" y="0" width="120" height="40" rx="4" fill="#854d0e" />
    <text x="200" y="24" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">MODERATE (35-64)</text>

    <rect x="280" y="0" width="120" height="40" rx="4" fill="#9a3412" />
    <text x="340" y="24" text-anchor="middle" fill="#fed7aa" font-size="11" font-weight="bold">HIGH (65-84)</text>

    <rect x="420" y="0" width="120" height="40" rx="4" fill="#991b1b" />
    <text x="480" y="24" text-anchor="middle" fill="#fecaca" font-size="11" font-weight="bold">CRITICAL (&ge; 85)</text>
  </g>

  <!-- Step 7: Priority Index -->
  <g transform="translate(620, 415)">
    <rect x="0" y="0" width="300" height="70" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="150" y="25" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="bold">DEBT PRIORITY INDEX (DPI)</text>
    <text x="150" y="45" text-anchor="middle" fill="#f8fafc" font-size="10">0.45·R(t) + 0.25·DownstreamBlocked</text>
    <text x="150" y="60" text-anchor="middle" fill="#94a3b8" font-size="10">+ 0.20·UrgencyScore + 0.10·CostOfDelay</text>
  </g>
</svg>
